<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>En Güzel Anne Adayına ✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85); /* Şeffaflığı artırdık */
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.3);
            /* Kutuyu iyice daralttık */
            width: 70%; 
            max-width: 280px; 
            border: 2px solid #ffc1cc;
            position: relative;
            z-index: 10;
            animation: bounceIn 1.2s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .flower-icon {
            font-size: 35px;
            margin-bottom: 5px;
            display: block;
        }

        h1 {
            color: #d63384;
            font-size: 1.2rem;
            margin: 10px 0;
        }

        p {
            color: #444;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 8px 0;
        }

        .highlight {
            color: #ff4d6d;
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
            margin: 12px 0;
            line-height: 1.3;
        }

        .gif-container img {
            width: 120px; /* GIF'i de orantılı küçülttük */
            border-radius: 15px;
            margin-top: 10px;
        }

        /* Çiçek Yaprakları */
        .petal {
            position: absolute;
            background-color: #ffc1cc;
            border-radius: 150% 0 150% 0;
            opacity: 0.6;
            pointer-events: none;
            animation: drift 5s infinite linear;
            z-index: 1;
        }

        @keyframes drift {
            0% { 
                transform: translateY(-10vh) rotate(0deg) translateX(0); 
                opacity: 0;
            }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { 
                transform: translateY(110vh) rotate(360deg) translateX(100px); 
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="flower-icon">🌸🌷🌺</span>
        <h1>Canım Bebişim,</h1>
        <p>Bugün senin de günün...</p>
        <span class="highlight">Dünyanın en güzel anne adayısın! 🤱✨</span>
        <p>Anneler günün kutlu olsun, seni çok seviyorum.</p>
        
        <div class="gif-container">
            <img src="https://media.tenor.com/7bA_vNIno_AAAAAi/peach-goma.gif" alt="Sevgilerle">
        </div>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            
            const size = Math.random() * 10 + 7 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            
            petal.style.animationDuration = Math.random() * 3 + 4 + 's';
            const colors = ["#ffc1cc", "#ffb7c5", "#ffdae0", "#ffd1dc"];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 7000);
        }

        // Çiçeklerin daha yoğun görünmesi için süreyi kısalttım
        setInterval(createPetal, 200);
    </script>
</body>
</html>
