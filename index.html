<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>En Güzel Anne Adayına ✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff5f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Çiçeklerin taşmasını engeller */
            touch-action: none;
        }

        .container {
            text-align: center;
            padding: 25px 20px;
            background: rgba(255, 255, 255, 0.9); /* Biraz daha şeffaf yaptık ki arkası hissedilsin */
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
            width: 85%; /* Mobilde kutuyu biraz daralttık */
            max-width: 350px; /* Tablet/PC'de çok yayılmasın */
            border: 2px solid #ffc1cc;
            position: relative;
            z-index: 10;
            animation: bounceIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .flower-icon {
            font-size: 45px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            color: #d63384;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #444;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 10px 0;
        }

        .highlight {
            color: #ff4d6d;
            font-weight: bold;
            font-size: 1.3rem;
            display: block;
            margin: 15px 0;
        }

        .gif-container img {
            width: 150px; /* Mobilde GIF'i küçülttük */
            border-radius: 20px;
            margin-top: 15px;
        }

        /* Çiçek Yaprakları */
        .petal {
            position: absolute;
            background-color: #ffc1cc;
            border-radius: 150% 0 150% 0;
            opacity: 0.6;
            pointer-events: none;
            animation: drift 6s infinite linear;
            z-index: 1; /* Kutunun arkasında kalacaklar */
        }

        @keyframes drift {
            0% { 
                transform: translateY(-10vh) rotate(0deg) translateX(0); 
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { 
                transform: translateY(110vh) rotate(360deg) translateX(80px); 
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="flower-icon">🌸🌷🌺</span>
        <h1>Canım Bebişim,</h1>
        <p>Bugün senin de günün... Kalbinin saflığı ve o eşsiz şefkatinle benim gözümde sen;</p>
        <span class="highlight">Dünyanın en güzel anne adayısın! 🤱✨</span>
        <p>Anneler günün kutlu olsun,<br>seni her şeyden çok seviyorum.</p>
        
        <div class="gif-container">
            <img src="https://media.tenor.com/7bA_vNIno_AAAAAi/peach-goma.gif" alt="Sevgilerle">
        </div>
    </div>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            
            // Ekran genişliğine göre rastgele başlangıç
            petal.style.left = Math.random() * 100 + 'vw';
            
            // Rastgele boyutlar
            const size = Math.random() * 12 + 8 + 'px';
            petal.style.width = size;
            petal.style.height = size;
            
            // Rastgele hız ve renk
            petal.style.animationDuration = Math.random() * 4 + 4 + 's';
            const colors = ["#ffc1cc", "#ffb7c5", "#ffdae0", "#ffd1dc"];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(petal);

            // Belleği temizlemek için yaprağı sil
            setTimeout(() => {
                petal.remove();
            }, 8000);
        }

        // Çiçek sıklığını telefonda kasmaması için 300ms yaptık
        setInterval(createPetal, 300);
    </script>
</body>
</html>
